    .bar-bg { fill: #1a1f1a; }
    .bar-easy { fill: #70FF9E; }
    .bar-medium { fill: #7CFF6B; }
    .bar-hard { fill: #48FF00; }
  </style>
  
  <rect width="500" height="330" fill="#0A0F0A" stroke="#48FF00" stroke-width="2" rx="8"/>
  
  <text x="25" y="40" class="title">sagarprajahozi</text>
  <text x="25" y="60" class="text">GeeksforGeeks Profile</text>
  
  <text x="25" y="95" class="bar-label">Easy: 68</text>
  <rect x="25" y="103" width="450" height="8" class="bar-bg" rx="4"/>
  <rect x="25" y="103" width="100" height="8" class="bar-easy" rx="4"/>
  
  <text x="25" y="138" class="bar-label">Medium: 197</text>
  <rect x="25" y="146" width="450" height="8" class="bar-bg" rx="4"/>
  <rect x="25" y="146" width="290" height="8" class="bar-medium" rx="4"/>
  
  <text x="25" y="181" class="bar-label">Hard: 30</text>

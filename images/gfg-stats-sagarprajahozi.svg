  <rect x="25" y="230" width="140" height="80" fill="#0A0F0A" stroke="#48FF00" stroke-width="2" rx="6"/>
  <text x="95" y="280" class="stat-value" text-anchor="middle">309</text>
  <text x="95" y="300" class="stat-label" text-anchor="middle">Problems Solved</text>
  
  <rect x="180" y="230" width="140" height="80" fill="#0A0F0A" stroke="#48FF00" stroke-width="2" rx="6"/>
  <text x="250" y="280" class="stat-value" text-anchor="middle">1159</text>
  <text x="250" y="300" class="stat-label" text-anchor="middle">Coding Score</text>
  
  <rect x="335" y="230" width="140" height="80" fill="#0A0F0A" stroke="#48FF00" stroke-width="2" rx="6"/>
  <text x="405" y="280" class="stat-value" text-anchor="middle">3</text>
  <text x="405" y="300" class="stat-label" text-anchor="middle">Institute Rank</text>

    .stat-value { fill: #70FF9E; font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 42px; font-weight: 700; }
    .stat-label { fill: #C8FFC4; font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 12px; }
